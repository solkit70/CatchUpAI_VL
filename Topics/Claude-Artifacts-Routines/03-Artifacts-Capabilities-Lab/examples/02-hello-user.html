<title>M3 Lab 02 누가 보고 있나</title>
<style>
  :root{--bg:#f3f5f8;--panel:#ffffff;--ink:#18212e;--muted:#5b6778;--line:#d9dee6;--accent:#2b6cb0;--accent-ink:#ffffff;--ok:#1f7a4d;--warn:#a15c00}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11161d;--panel:#19212b;--ink:#e6ebf2;--muted:#9aa6b6;--line:#2c3643;--accent:#6aa5e6;--accent-ink:#0d1520;--ok:#5fc48f;--warn:#e2a54a;color-scheme:dark}}
  :root[data-theme="dark"]{--bg:#11161d;--panel:#19212b;--ink:#e6ebf2;--muted:#9aa6b6;--line:#2c3643;--accent:#6aa5e6;--accent-ink:#0d1520;--ok:#5fc48f;--warn:#e2a54a;color-scheme:dark}
  body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding-inline:16px;padding-block:32px}
  main{max-width:560px;margin:0 auto;display:grid;gap:20px}
  .eyebrow{font:600 12px/1 ui-monospace,monospace;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  h1{margin:0;font-size:24px;text-wrap:balance}
  p{margin:0;color:var(--muted);line-height:1.6}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;display:grid;gap:16px}
  .hello{font:700 26px/1.3 inherit}
  dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
  dt{color:var(--muted)} dd{margin:0;font-family:ui-monospace,monospace;word-break:break-all}
</style>

<main>
  <div class="eyebrow">Claude-Artifacts-Routines · M3 실습 1-②</div>
  <h1>누가 보고 있나</h1>
  <p><code>user</code> 기능은 지금 이 페이지를 연 사람이 누구인지, 무엇을 할 수 있는지를 페이지에 알려 줍니다. 창마다, 계정마다 다르게 보입니다.</p>
  <section class="panel" aria-live="polite">
    <div class="hello" id="hello">확인 중…</div>
    <dl>
      <dt>작성자(owner)인가</dt><dd id="owner">–</dd>
      <dt>편집(admin) 가능</dt><dd id="edit">–</dd>
      <dt>공유 데이터 쓰기</dt><dd id="write">–</dd>
      <dt>게스트인가</dt><dd id="guest">–</dd>
      <dt>id (앞 8자)</dt><dd id="uid">–</dd>
    </dl>
  </section>
  <p>이름은 화면에 보여 줄 때만 씁니다. 저장해야 할 때는 이름이 아니라 id 만 저장합니다. 이름은 바뀌고, 보는 사람마다 다르게 보일 수 있기 때문입니다.</p>
</main>

<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const yn = (v) => v === null || v === undefined ? "알 수 없음" : (v ? "예" : "아니오");
  const user = await window.claude?.use?.("user");
  if (!user) { $("hello").textContent = "보는 사람 정보를 받을 수 없는 보기입니다"; return; }
  const [me, owner, edit, write, id] = await Promise.all([user.me(), user.isOwner(), user.canEdit(), user.can("data.write"), user.id()]);
  $("hello").textContent = "안녕하세요, " + (me.name || "이름 없는 방문자") + " 님";
  $("owner").textContent = yn(owner);
  $("edit").textContent = yn(edit);
  $("write").textContent = yn(write);
  if (id) {
    const p = await user.profiles([id]);
    $("guest").textContent = yn(p[id]?.guest);
    $("uid").textContent = id.slice(0, 8) + "…";
  } else { $("guest").textContent = "id 없음"; $("uid").textContent = "없음"; }
})();
</script>
